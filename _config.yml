# Site settings
title: Ian Horch
email: hrochi@lafayette.edu
description: >-
  Ian Horch is an actor, writer, and engineer studying Integrative Engineering
  with a concentration in robotics at Lafayette College.
baseurl: ""
url: "https://ianhorchata.github.io"
github_username: ianhorchata

# Each markdown file in _projects/ becomes a homepage card and a page
# at /projects/<filename>/. Copy an existing file to add a project.
collections:
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: project

# Build settings
theme: minima
plugins:
  - jekyll-feed
